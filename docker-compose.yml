version: '3.8'

services:
  openfloyd:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: openfloyd_agent
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - LOG_LEVEL=info
    ports:
      - "3000:3000"
    volumes:
      - ./workspace:/app/workspace
      - ./wa_auth:/app/wa_auth
    networks:
      - floyd_network
    depends_on:
      - redis
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '1.0'
          memory: 512M

  redis:
    image: redis:7-alpine
    container_name: floyd_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - floyd_network
    command: redis-server --appendonly yes

networks:
  floyd_network:
    driver: bridge

volumes:
  redis_data:
